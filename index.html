<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Mirror Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav id="top-nav" class="hidden">
      <img src="assets//textures/puce.png" alt="PUCE" class="nav-logo" />
      <button id="btn-home">🏠 Inicio</button>
      <span id="section-title">Sección</span>
    </nav>

    <section id="sec-home" class="active">
      <canvas id="mirror-scene" aria-hidden="true"></canvas>
      <div class="hero">
        <div class="hero-shell">
          <span class="hero-eyebrow">Mirror Lab · PUCE</span>
          <img src="assets//textures/puce.png" alt="PUCE aniversario" class="hero-logo" />
          <h1>AR Mirror Web</h1>
          <p class="hero-copy">Experiencias de cámara, gestos y realidad aumentada con una interfaz tipo cristal, profundidad 3D y energía espacial.</p>
        </div>

        <div class="menu-grid">
          <button class="card card-brand" onclick="window.showSection('animals')">
            <span class="card-icon">🦁</span>
            <span class="card-kicker">naturaleza</span>
            <span class="card-title">Animales AR</span>
            <span class="card-copy">Revela la fauna del Yasuní moviendo tus manos frente a la cámara.</span>
          </button>
          <button class="card" onclick="window.showSection('senias')">
            <span class="card-icon">✋</span>
            <span class="card-kicker">gestos</span>
            <span class="card-title">Lengua de señas</span>
            <span class="card-copy">Reconocimiento visual para traducir señales frente al espejo.</span>
          </button>
        </div>

        <h2 class="group-title">Suite de Juegos</h2>
        <div class="menu-grid menu-games">
          <button class="card" onclick="window.showSection('game')">
            <span class="card-icon">🐦</span>
            <span class="card-kicker">rostro</span>
            <span class="card-title">Big Flappy Bird</span>
            <span class="card-copy">Controla el vuelo con la nariz y esquiva obstáculos.</span>
          </button>
          <button class="card" onclick="window.showSection('airpiano')">
            <span class="card-icon">🎹</span>
            <span class="card-kicker">manos</span>
            <span class="card-title">Air Piano</span>
            <span class="card-copy">Toca notas suspendidas en el aire con gestos.</span>
          </button>
          <button class="card" onclick="window.showSection('donkeyfitness')">
            <span class="card-icon">🦍</span>
            <span class="card-kicker">fitness</span>
            <span class="card-title">Donkey Kong Fitness</span>
            <span class="card-copy">Muévete para superar retos físicos en pantalla.</span>
          </button>
          <button class="card" onclick="window.showSection('antigravedad')">
            <span class="card-icon">🪐</span>
            <span class="card-kicker">espacio</span>
            <span class="card-title">Antigravedad PUCE</span>
            <span class="card-copy">Un reto orbital con partículas, movimiento y precisión.</span>
          </button>
        </div>
      </div>
    </section>

    <section id="sec-app" class="hidden">
      <div class="canvas-container">
        <div id="loading-overlay" class="hidden">
          <div class="loader"></div>
          <p>Preparando experiencia...</p>
        </div>
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
        <div id="game-over-screen" class="hidden">
          <div class="menu-box">
            <h2>¡Puntuación Final!</h2>
            <h1 id="final-score">0</h1>
            <button id="restart-btn">Intentar de Nuevo</button>
            <button onclick="window.showSection('home')">Menú Principal</button>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
